name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can — it helps a lot.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Start tracelocal with `tracelocal --port 4317`
        2. Send a span with ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: What should have happened?
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: tracelocal version
      description: Run `tracelocal --version` or check the release tag.
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: go_version
    attributes:
      label: Go version (if built from source)
      placeholder: go1.22.0

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Run with `--log /tmp/tracelocal.log` and paste relevant output.
      render: text
