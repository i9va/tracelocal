version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: tracelocal
    main: ./cmd/tracelocal
    binary: tracelocal
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

brews:
  - name: tracelocal
    repository:
      owner: i9va
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://i9va.github.io/tracelocal
    description: Zero-config local distributed tracing for backend developers.
    license: Apache-2.0
    install: |
      bin.install "tracelocal"
    test: |
      system "#{bin}/tracelocal", "--version"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
